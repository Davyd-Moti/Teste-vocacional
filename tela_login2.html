
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha-tech | Login</title>
    <link rel="stylesheet" href="tela_login2.css">
</head>

<body>

    <div class="container">

        <img
            class="imagem"
            src="Logo EscolhaTec — versão formal.png"
            alt="Logo Escolha-tech"
        >

        <h1>Acesso ao login</h1>

        <p>Faça login para ter acesso ao nosso teste.</p>

        <form id="formLogin">

            <label for="emailLogin">E-mail do aluno:</label>

            <input
                type="email"
                id="emailLogin"
                name="email"
                required
                placeholder="exemplo@gmail.com"
            >

            <label for="senhaLogin">Sua senha:</label>

            <input
                type="password"
                id="senhaLogin"
                name="senha"
                required
                placeholder="Digite sua senha"
            >

            <div class="mensagem" id="mensagemLogin"
                 role="status" aria-live="polite" hidden></div>

            <button type="submit" id="botaoLogin">
                Entrar
            </button>

        </form>

        <a href="tela_login.html" class="link-cadastro">
            Ainda não tem uma conta? Cadastre-se
        </a>

    </div>

    <script type="module" src="tela_login.js"></script>

</body>
</html>
